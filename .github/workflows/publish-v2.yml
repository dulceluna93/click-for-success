name: Publish desktop packages

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release/*.dmg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-windows
      - build-macos
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish the tagged release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="$(node -p 'require("./package.json").version')"
          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match package version $version."
            exit 1
          fi

          assets=(
            "release-assets/Click for Success Setup $version.exe"
            "release-assets/Click for Success $version.exe"
            "release-assets/Click for Success-$version-mac-universal.dmg"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done

          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$draft" != "true" ]]; then
              echo "Release $tag is already published."
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            notes=(--generate-notes)
            if [[ -f ".github/release-notes/$tag.md" ]]; then
              notes=(--notes-file ".github/release-notes/$tag.md")
            fi
            gh release create "$tag" "${assets[@]}" --verify-tag --draft \
              --title "Click for Success $tag" "${notes[@]}"
          fi
          gh release edit "$tag" --draft=false --latest
