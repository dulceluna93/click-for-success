name: Publish v2.0.0 packages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v2.yml"
      - "src/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.mjs"
      - "build/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows packages
        run: npm run dist:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/Click for Success Setup 2.0.0.exe
            release/Click for Success 2.0.0.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:mac

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release/*.dmg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update v2.0.0 release
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Click for Success 2.0.0

          ### 主要更新

          - 改进窗口缩放、拖动与小尺寸显示体验
          - 新增按键帮助提示
          - 新增电脑键盘映射模式和按键动画
          - 记住庆祝方式及正计时/倒计时选择
          - 任务生成后锁定任务划分数量
          - 支持直接编辑任务划分数量
          - 输入任务名称后可按 Enter 生成任务
          - 优化历史记录内容和时间格式
          - 新增历史记录 TXT 导出
          - 更新内置说明书和 README

          ### 下载说明

          - `Click for Success Setup 2.0.0.exe`：Windows 安装版
          - `Click for Success 2.0.0.exe`：Windows 便携版
          - `Click for Success-2.0.0-mac-universal.dmg`：macOS 通用版，支持 Intel 与 Apple Silicon

          ### 注意

          Windows 和 macOS 构建均未进行商业代码签名。macOS 版本由 GitHub Actions 构建，尚未在真实 Mac 设备上测试或公证。
          EOF

          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v2.0.0 --repo "$GITHUB_REPOSITORY" --title "Click for Success v2.0.0" --notes-file release-notes.md
          else
            gh release create v2.0.0 --repo "$GITHUB_REPOSITORY" --title "Click for Success v2.0.0" --notes-file release-notes.md
          fi

          gh release upload v2.0.0 release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v2.0.0 --repo "$GITHUB_REPOSITORY" --draft=false --latest
