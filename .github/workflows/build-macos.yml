name: Build macOS package

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set -o pipefail
          npm run dist:mac 2>&1 | tee mac-build.log || {
            {
              echo "## macOS build failure log"
              echo '```text'
              tail -n 120 mac-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: click-for-success-${{ github.ref_name }}-mac
          path: release/*.dmg
          if-no-files-found: error
